name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Pasang JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # JavaFX needs a display for a few UI tests; the Windows and macOS runners have one, Linux gets a virtual one.
      - name: Pasang Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build dan tes (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a mvn --batch-mode verify

      - name: Build dan tes
        if: runner.os != 'Linux'
        run: mvn --batch-mode verify

      - name: Simpan laporan tes jika gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-tes-${{ matrix.os }}
          path: target/surefire-reports

  installer:
    name: Installer (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            profile: installer-windows
            pattern: target/installer/output/*.msi
          - os: macos-latest
            profile: installer-mac
            pattern: target/installer/output/*.dmg
    steps:
      - uses: actions/checkout@v4

      - name: Pasang JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The Windows runner image already has the WiX Toolset 3.x that jpackage needs for .msi.
      - name: Buat installer
        run: mvn --batch-mode -DskipTests -P${{ matrix.profile }} package

      - name: Unggah installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    name: Rilis
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Lampirkan ke GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
